<title>The AI ladder: retrieval, adapters, humans, and who holds the keys</title>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"TechArticle","@id":"https://persephonepunch.github.io/crm-sync-setup/ai-ladder-escalation-and-mandates.html#article","headline":"The AI ladder: retrieval, adapters, humans, and who holds the keys","description":"Challenge and solution for putting AI into commerce without letting it decide what it may not. Definitions of RAG, CRAG, LoRA and human-in-the-loop escalation; when data justifies each rung; and why ADK, Kubernetes/Helm and a Cloudflare higher-order 'helmet' are three different layers — with the mandate as the only way an agent is allowed to act; and what a SOC 2 review — a procedural assessment of how an organisation operates, not a certification — asks of AI transport.","datePublished":"2026-09-25","dateModified":"2026-09-25","author":{"@type":"Organization","name":"CRM Sync","url":"https://crm-sync.dev"},"publisher":{"@type":"Organization","name":"CRM Sync","url":"https://crm-sync.dev"},"mainEntityOfPage":"https://persephonepunch.github.io/crm-sync-setup/ai-ladder-escalation-and-mandates.html","inLanguage":"en","isBasedOn":"https://github.com/persephonepunch/crm-sync-setup/blob/master/AI-LADDER-ESCALATION-AND-MANDATES.md","articleSection":"Specs","license":"https://creativecommons.org/licenses/by/4.0/","keywords":["CRAG","corrective retrieval-augmented generation","LoRA","low-rank adaptation","human in the loop","escalation","Google ADK","Kubernetes","Helm","Cloudflare Workers","higher-order function","agent mandate","AP2","SOC 2","Trust Services Criteria"]}</script>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"FAQPage","@id":"https://persephonepunch.github.io/crm-sync-setup/ai-ladder-escalation-and-mandates.html#faq","mainEntity":[{"@type":"Question","name":"What is CRAG?","acceptedAnswer":{"@type":"Answer","text":"Corrective Retrieval-Augmented Generation (Yan et al., 2024): RAG with a grader between retrieval and answer. Passages judged correct are used, incorrect ones are discarded and another source is tried, ambiguous ones use both. The name is also used for Meta's Comprehensive RAG Benchmark (KDD Cup 2024), which is a test set, not a technique."}},{"@type":"Question","name":"What is LoRA?","acceptedAnswer":{"@type":"Answer","text":"Low-Rank Adaptation (Hu et al., 2021): the base model is frozen and small low-rank matrices are trained beside chosen layers, well under 1% of the parameters, shipped as a swappable adapter. It changes how a model writes — tone, vocabulary, format — and is the wrong tool for facts that change, which belong in retrieval."}},{"@type":"Question","name":"When does data justify training a LoRA adapter instead of improving RAG?","acceptedAnswer":{"@type":"Answer","text":"When an evaluation set shows retrieval returning the right passages while the answers are still wrong in how they are written, and there are enough clean question-and-accepted-answer pairs for one behaviour — as a rule of thumb, hundreds to low thousands. Without an evaluation set there is no evidence either way."}},{"@type":"Question","name":"Is Google ADK the same as a permissioned API endpoint?","acceptedAnswer":{"@type":"Answer","text":"No. An endpoint with permission checks in its function stack corresponds to an ADK tool with a guard. The ADK agent is the layer that decides which tools to call. Because permission lives in the endpoint, the agent layer is swappable and cannot do more than the endpoint allows."}},{"@type":"Question","name":"What is an agent mandate?","acceptedAnswer":{"@type":"Answer","text":"A signed, capped, scoped, time-boxed, revocable authorisation for an agent to act on someone's behalf, bound to their consent. It is checked server-side on every action — the cap on the discounted total — so an agent never needs a standing key or a payment card."}}]}
</script>
