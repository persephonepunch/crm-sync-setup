<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 820" role="img" aria-labelledby="t d">
<title id="t">Where memory gets managed: Rust at compile time, the JVM at runtime</title>
<desc id="d">Five pipelines from source to running code, split by a line between build time and run time. Rust: the compiler and borrow checker prove every memory access and insert each free, then ship native machine code that runs with no runtime manager. Rust to Wasm: the same proof, shipped as a portable Wasm module that a host such as V8 or Wasmtime compiles at load and walls off, still with no garbage collector. Java and Kotlin on the JVM: the compiler ships bytecode, and the JVM's JIT and garbage collector manage memory while the program runs. Elm and TypeScript: compiled to JavaScript, with V8's garbage collector managing memory at runtime. C: compiled to machine code with no ownership check, and memory freed by hand. Three cards draw the security consequences.</desc>
