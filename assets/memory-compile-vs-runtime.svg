<text class="sec" x="60" y="636">WHY IT MATTERS FOR SECURITY</text>
<rect class="box" x="60" y="652" width="480" height="110"/>
<text class="bt" x="74" y="678">No runtime to patch, but you rebuild</text>
<text class="b" x="74" y="698"></text>
<text class="b" x="74" y="700">A JVM fix can ship as a runtime update.</text>
<text class="b" x="74" y="718">A Rust fix means recompiling and</text>
<text class="b" x="74" y="736">redeploying the binary.</text>
<rect class="box" x="560" y="652" width="480" height="110"/>
<text class="bt" x="574" y="678">Secrets can be wiped</text>
<text class="b" x="574" y="698"></text>
<rect x="1002.0" y="660" width="28" height="18" rx="9" fill="#fff" stroke="#000" stroke-width="1.2" stroke-dasharray="3 2"/><text class="n" x="1016.0" y="672.5">19</text>
<text class="b" x="574" y="700">Rust frees memory at a known point, so</text>
<text class="b" x="574" y="718">zeroize can erase a key. JVM Strings</text>
<text class="b" x="574" y="736">can&#x27;t be changed, and the GC copies them.</text>
<rect class="box" x="1060" y="652" width="480" height="110"/>
<text class="bt" x="1074" y="678">Nothing to escape, except unsafe</text>
<text class="b" x="1074" y="698"></text>
<text class="b" x="1074" y="700">The compile-time proof holds everywhere</text>
<text class="b" x="1074" y="718">but unsafe blocks: the foot gun to search</text>
<text class="b" x="1074" y="736">for in any Rust code review.</text>
<text class="bt" x="60" y="798">The JVM manages memory at runtime. Rust proves it at compile time.</text>
</svg>