<text class="lt" x="596" y="1108">2006–07</text>
<text class="b" x="596" y="1128">CUDA opens the GPU</text>
<text class="g" x="596" y="1146">to any workload</text>
<path class="rule" d="M864,1068V1084"/>
<text class="lt" x="864" y="1108">2012</text>
<text class="b" x="864" y="1128">AlexNet trained on</text>
