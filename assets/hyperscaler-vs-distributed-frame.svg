<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1186" role="img" aria-labelledby="t d">
<title id="t">The frame-budget origin: game engines already bind before they allocate</title>
<desc id="d">Two paired pipelines. Game engine, on a 16.6 ms frame budget: frame budget, culling, level of detail, streaming and mipmaps, batching, the player&#x27;s GPU, and a render farm only for cinematics and lightmaps. Bind before you allocate, on a GPU and token budget: GPU budget, the gate, rank then fall back, edge cache, queues, device first, and a rented GPU cluster only for what is left. Shared ideas: fix the budget first; don&#x27;t draw what isn&#x27;t seen or send what isn&#x27;t allowed; less detail where it matters less; reuse what&#x27;s loaded; group the work; use the GPU already there; rent only the remainder. Renderers: Flash Player in C++ is replaced by Ruffle in Rust compiled to Wasm; SVG renderers in C by librsvg in Rust and resvg; ImageMagick in C by Rust image decoders that can run as Wasm at the edge; a native renderer isolated in a cluster pod becomes a safe renderer moved to the device or edge, near the data. Compile once, render cheap: Rust source is optimized at build with LTO and wasm-opt into a compact bundle with a size budget, compiled while it downloads, and runs with no JIT warm-up or GC pauses, using WebGPU for the GPU part. Timeline: 1993 NVIDIA founded for 3D games; 1999 GeForce 256 sold as the first GPU; 2006 to 2007 CUDA opens the GPU to any workload; 2012 AlexNet trained on two gaming cards; late 2010s mining GPUs turn into GPU clouds; 2020s GPUs reserved by contract, centrally.</desc>
