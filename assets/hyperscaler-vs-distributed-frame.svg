<path class="rule" d="M1132,1068V1084"/>
<text class="lt" x="1132" y="1108">late 2010s</text>
<text class="b" x="1132" y="1128">mining GPUs turn</text>
<text class="g" x="1132" y="1146">into GPU clouds</text>
<path class="rule" d="M1400,1068V1084"/>
<text class="lt" x="1400" y="1108">2020s</text>
<text class="b" x="1400" y="1128">GPUs reserved by</text>
<text class="g" x="1400" y="1146">contract, centrally</text>
