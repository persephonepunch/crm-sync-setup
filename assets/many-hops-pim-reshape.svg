<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="600" viewBox="-5 -5 1510 600">
<rect id="background" x="-5" y="-5" width="1510" height="600" fill="#fff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<g id="header">
<text x="37" y="52" font-family="Arial" font-size="30" fill="#000" text-anchor="start">Many hops, many reshapes: a product on its way to the channels</text>
<text x="37" y="80" font-family="Arial" font-size="14" fill="#222" text-anchor="start">A common chain runs ECC through a PIM, a feed tool and a marketplace hub. Each hop imports, reshapes into its own model and exports again.</text>
</g>
<g id="lane-many-hops">
<text x="37" y="130" font-family="Arial" font-size="18" fill="#000" text-anchor="start">Many hops</text>
<rect x="128.8" y="115" width="213.2" height="20" fill="#111"/>
<text x="235.40000000000003" y="129" font-family="Arial" font-size="10.5" fill="#fff" text-anchor="middle" letter-spacing="0.3">5 RESHAPES · 3 VENDOR COPIES</text>
<g id="lane-many-hops-node-1">
<rect x="37.0" y="160" width="204.3" height="118" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="49.0" y="184" font-family="Arial" font-size="14.5" fill="#000" text-anchor="start">SAP ECC</text>
<text x="49.0" y="206" font-family="Arial" font-size="12" fill="#333" text-anchor="start">MARA, MAKT, pricing</text>
<text x="49.0" y="224" font-family="Arial" font-size="12" fill="#333" text-anchor="start">SAP field names</text>
<text x="49.0" y="242" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Batch export</text>
</g>
<line x1="244.3" y1="219.0" x2="278.3" y2="219.0" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="261.33333333333337" y="211.0" font-family="Arial" font-size="10.5" fill="#d01a57" text-anchor="middle">#1</text>
<g id="lane-many-hops-node-2">
<rect x="281.3" y="160" width="204.3" height="118" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="293.33333333333337" y="184" font-family="Arial" font-size="14.5" fill="#000" text-anchor="start">CSV export</text>
<text x="293.33333333333337" y="206" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Columns, not a schema</text>
<text x="293.33333333333337" y="224" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Leading zeros, units</text>
<text x="293.33333333333337" y="242" font-family="Arial" font-size="12" fill="#333" text-anchor="start">No consent, no key</text>
</g>
<line x1="488.7" y1="219.0" x2="522.7" y2="219.0" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="505.66666666666674" y="211.0" font-family="Arial" font-size="10.5" fill="#d01a57" text-anchor="middle">#2</text>
<g id="lane-many-hops-node-3">
<rect x="525.7" y="160" width="204.3" height="118" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="537.6666666666667" y="184" font-family="Arial" font-size="14.5" fill="#000" text-anchor="start">Salsify (PIM/PXM)</text>
<text x="537.6666666666667" y="206" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Imports into its model</text>
<text x="537.6666666666667" y="224" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Enriches, approves</text>
<text x="537.6666666666667" y="242" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Syndicates per channel</text>
</g>
<line x1="733.0" y1="219.0" x2="767.0" y2="219.0" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="750.0000000000001" y="211.0" font-family="Arial" font-size="10.5" fill="#d01a57" text-anchor="middle">#3</text>
<g id="lane-many-hops-node-4">
<rect x="770.0" y="160" width="204.3" height="118" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="782.0" y="184" font-family="Arial" font-size="14.5" fill="#000" text-anchor="start">Feedonomics</text>
<text x="782.0" y="206" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Feed rules per channel</text>
<text x="782.0" y="224" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Titles, categories</text>
<text x="782.0" y="242" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Its own copy</text>
</g>
<line x1="977.3" y1="219.0" x2="1011.3" y2="219.0" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="994.3333333333334" y="211.0" font-family="Arial" font-size="10.5" fill="#d01a57" text-anchor="middle">#4</text>
<g id="lane-many-hops-node-5">
<rect x="1014.3" y="160" width="204.3" height="118" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="1026.3333333333335" y="184" font-family="Arial" font-size="14.5" fill="#000" text-anchor="start">Rithum hub</text>
<text x="1026.3333333333335" y="206" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Marketplace listings</text>
<text x="1026.3333333333335" y="224" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Orders, drop ship</text>
<text x="1026.3333333333335" y="242" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Its own copy</text>
</g>
<line x1="1221.7" y1="219.0" x2="1255.7" y2="219.0" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1238.6666666666667" y="211.0" font-family="Arial" font-size="10.5" fill="#d01a57" text-anchor="middle">#5</text>
<g id="lane-many-hops-node-6">
<rect x="1258.7" y="160" width="204.3" height="118" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="1270.6666666666667" y="184" font-family="Arial" font-size="14.5" fill="#000" text-anchor="start">Channels</text>
<text x="1270.6666666666667" y="206" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Amazon, Walmart</text>
<text x="1270.6666666666667" y="224" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Google, Meta</text>
<text x="1270.6666666666667" y="242" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Each its own schema</text>
</g>
<text x="37" y="304" font-family="Arial" font-size="13.5" fill="#000" text-anchor="start">Where it breaks: a fix at hop 4 never reaches the source · each vendor holds a copy and a credential · a delete must chase every hop · errors surface at the channel, five hops from the cause</text>
</g>
<g id="lane-one-record">
<text x="37" y="366" font-family="Arial" font-size="18" fill="#000" text-anchor="start">One record, a projection per channel</text>
<rect x="350.2" y="351" width="75.2" height="20" fill="#111"/>
<text x="387.8" y="365" font-family="Arial" font-size="10.5" fill="#fff" text-anchor="middle" letter-spacing="0.3">PIM SYNC</text>
<g id="lane-one-record-node-1">
<rect x="37.0" y="396" width="448.7" height="118" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="49.0" y="420" font-family="Arial" font-size="14.5" fill="#000" text-anchor="start">ECC or S/4HANA</text>
<text x="49.0" y="442" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Change event or OData</text>
<text x="49.0" y="460" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Released APIs, not files</text>
<text x="49.0" y="478" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Material number kept as the key</text>
</g>
<line x1="488.7" y1="455.0" x2="522.7" y2="455.0" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<g id="lane-one-record-node-2">
<rect x="525.7" y="396" width="448.7" height="118" fill="#fff" stroke="#f22468" stroke-width="2.5"/>
<text x="537.6666666666667" y="420" font-family="Arial" font-size="14.5" fill="#d01a57" text-anchor="start">Xano record (PIM Sync)</text>
<text x="537.6666666666667" y="442" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Product, assets, variants</text>
<text x="537.6666666666667" y="460" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Translations, market prices</text>
<text x="537.6666666666667" y="478" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Consent and grants</text>
</g>
<line x1="977.3" y1="455.0" x2="1011.3" y2="455.0" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<g id="lane-one-record-node-3">
<rect x="1014.3" y="396" width="448.7" height="118" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="1026.3333333333335" y="420" font-family="Arial" font-size="14.5" fill="#000" text-anchor="start">Projections by API</text>
<text x="1026.3333333333335" y="442" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Shopify Admin GraphQL</text>
<text x="1026.3333333333335" y="460" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Merchant API JSON</text>
<text x="1026.3333333333335" y="478" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Webflow CMS, marketplaces</text>
</g>
<text x="37" y="540" font-family="Arial" font-size="13.5" fill="#d01a57" text-anchor="start">Why it holds: one reshape per channel, from one record · enrichment happens on the record, so every channel gets it · deletes and channel status flow back to the ledger</text>
</g>
<g id="footer">
<text x="37" y="574" font-family="Arial" font-size="12" fill="#555" text-anchor="start">Feed tools still earn their place for marketplace mapping; on this path they read from the API instead of owning a copy. Patterns, not claims about any vendor. CRM Sync · Middleware vs AI Architecture</text>
</g>
</svg>