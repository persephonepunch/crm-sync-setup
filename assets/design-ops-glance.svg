<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" aria-label="Eight capabilities at a glance, each with a one-sentence description">
  <rect width="1440" height="1080" fill="#ffffff"/>

  <text x="64" y="72" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#767676" letter-spacing="4">AT A GLANCE</text>
  <text x="64" y="124" font-family="Georgia, 'Iowan Old Style', serif" font-size="40" fill="#111">What each capability actually does</text>
  <text x="64" y="160" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="17" fill="#444">Same utility, same security, same scaling &#8212; plus minting.</text>
  <line x1="64" y1="192" x2="1376" y2="192" stroke="#111" stroke-width="2"/>

  <!-- ROW 1 -->
  <g>
    <line x1="64" y1="236" x2="696" y2="236" stroke="#111" stroke-width="1.5"/>
    <text x="64" y="278" font-family="Georgia, serif" font-size="26" fill="#111">Config manager</text>
    <text x="64" y="312" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">One place holds every setting, and it pushes itself out to every</text>
    <text x="64" y="336" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">surface you publish to.</text>
    <text x="64" y="368" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#0b333f">Cloudflare &#183; Push</text>
  </g>
  <g>
    <line x1="744" y1="236" x2="1376" y2="236" stroke="#111" stroke-width="1.5"/>
    <text x="744" y="278" font-family="Georgia, serif" font-size="26" fill="#111">Encryption</text>
    <text x="744" y="312" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">Credentials are sealed before they reach storage, so a database</text>
    <text x="744" y="336" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">dump is ciphertext and nothing else.</text>
    <text x="744" y="368" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#0b333f">Worker &#183; Envelope</text>
  </g>

  <!-- ROW 2 -->
  <g>
    <line x1="64" y1="424" x2="696" y2="424" stroke="#111" stroke-width="1.5"/>
    <text x="64" y="466" font-family="Georgia, serif" font-size="26" fill="#111">Key rotation</text>
    <text x="64" y="500" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">Swap a key with no downtime &#8212; the new one works before the</text>
    <text x="64" y="524" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">old one dies, so there is never a gap.</text>
    <text x="64" y="556" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#0b333f">JWKS &#183; Ceremony</text>
  </g>
  <g>
    <line x1="744" y1="424" x2="1376" y2="424" stroke="#111" stroke-width="1.5"/>
    <text x="744" y="466" font-family="Georgia, serif" font-size="26" fill="#111">Data binding</text>
    <text x="744" y="500" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">Your records live in your own Xano, and Webflow shows a mirror</text>
    <text x="744" y="524" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">of them rather than a second copy.</text>
    <text x="744" y="556" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#0b333f">Xano &#183; Rows</text>
  </g>

  <!-- ROW 3 -->
  <g>
    <line x1="64" y1="612" x2="696" y2="612" stroke="#111" stroke-width="1.5"/>
    <text x="64" y="654" font-family="Georgia, serif" font-size="26" fill="#111">Orchestration</text>
    <text x="64" y="688" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">Agents run scoped tools under a signed mandate, instead of a</text>
    <text x="64" y="712" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">scheduler somebody has to keep alive.</text>
    <text x="64" y="744" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#0b333f">Runners &#183; Mandate</text>
  </g>
  <g>
    <line x1="744" y1="612" x2="1376" y2="612" stroke="#111" stroke-width="1.5"/>
    <text x="744" y="654" font-family="Georgia, serif" font-size="26" fill="#111">Function logic</text>
    <text x="744" y="688" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">Your logic runs at the edge, everywhere at once, with no servers</text>
    <text x="744" y="712" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">to patch and nothing to drain.</text>
    <text x="744" y="744" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#0b333f">Workers &#183; Edge</text>
  </g>

  <!-- ROW 4 -->
  <g>
    <line x1="64" y1="800" x2="696" y2="800" stroke="#111" stroke-width="1.5"/>
    <text x="64" y="842" font-family="Georgia, serif" font-size="26" fill="#111">Directional gating</text>
    <text x="64" y="876" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">Every call is checked one direction at a time, against a row you</text>
    <text x="64" y="900" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#444">can revoke on your own.</text>
    <text x="64" y="932" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#0b333f">Caps &#183; Grants</text>
  </g>
  <g>
    <rect x="720" y="792" width="656" height="180" fill="#0b333f"/>
    <text x="744" y="842" font-family="Georgia, serif" font-size="26" fill="#ffffff">Plus minting</text>
    <text x="744" y="876" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#cfe6ec">Turn a file into an asset a customer can be granted &#8212; a print</text>
    <text x="744" y="900" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#cfe6ec">file, firmware, a document &#8212; sealed, tracked and revocable.</text>
    <text x="744" y="932" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#7fd4e8">Vault &#183; Grant</text>
  </g>

  <line x1="64" y1="1004" x2="1376" y2="1004" stroke="#111" stroke-width="2"/>
  <text x="64" y="1040" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="15" fill="#111">Vault is a command line. Consul is code, dev only. This is a browser.</text>
  <text x="64" y="1064" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#767676">Webflow &#183; Xano &#183; Cloudflare &#8212; the tools you already use.</text>
</svg>
