<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 920" role="img" aria-labelledby="t d">
<title id="t">One subject, every channel: consent is per TLD, data moves in real time</title>
<desc id="d">A strip across the top notes that OneTrust, Shopify and Webflow all already answer through Cloudflare, so the brand namespace sits on the network the traffic already uses. Two panels. Left, today: uk.brand.com, ca.brand.com and fr.brand.com each run their own consent banner and keep the choice in a browser cookie under different rules (UK GDPR and PECR; PIPEDA and Quebec Law 25; GDPR as applied by the CNIL). Four gaps are marked in red: a cookie scoped to the parent domain replays one market's choice under another market's rules; a dangling subdomain can forge that cookie; plugin wildcards are readable in the theme source; and the record is keyed to a browser session ID, not a subject. Four clouds (Azure ERP, CRM SaaS, AWS EDI, GCP Merchant and BigQuery) move data through a JVM service bus polled every 15 minutes into the Google Merchant and Ads audience and the Shopify audience. Right, the fix: web, mobile, POS, chatbot, IoT and firmware all reach a Cloudflare Worker, the Buy app in a per-brand dispatch namespace, which checks signature, market and purpose with a Rust type check and fails closed. Xano is the system of record for each subject's posture and ledger; a KV namespace holds a projection keyed by market and subject. An event socket sends to Azure Service Bus, CRM SaaS, AWS EventBridge and GCP Pub/Sub only when market, purpose and freshness allow. A Rust gRPC writer stamps posture onto BigQuery rows and Merchant API items, and both the Google Merchant and Ads audience and the Shopify audience are socketed to the same answer.</desc>
<defs><style>
 .h{font:700 20px Helvetica,Arial,sans-serif;fill:#000}
 .sec{font:700 10px Helvetica,Arial,sans-serif;fill:#767676;letter-spacing:.2em}
 .bt{font:700 15px Helvetica,Arial,sans-serif;fill:#000}
 .k{font:700 12px Helvetica,Arial,sans-serif;fill:#000}
 .b{font:13px Helvetica,Arial,sans-serif;fill:#000}
 .c{font:12px Helvetica,Arial,sans-serif;fill:#000}
 .g{font:12px Helvetica,Arial,sans-serif;fill:#767676}
 .s{font:11px Helvetica,Arial,sans-serif;fill:#767676}
 .r{font:700 13px Helvetica,Arial,sans-serif;fill:#c8102e}
 .box{fill:#fff;stroke:#000;stroke-width:1.5}
 .goal{fill:#fff;stroke:#000;stroke-width:3}
 .gap{fill:#fff;stroke:#c8102e;stroke-width:1.6;stroke-dasharray:5 4}
 .proj{fill:#fff;stroke:#767676;stroke-width:1.5;stroke-dasharray:5 4}
 .band{fill:#f4f4f4;stroke:none}
 .rule{stroke:#000;stroke-width:.8;fill:none}
 .sock{stroke:#000;stroke-width:4;fill:none}
 .ln{stroke:#767676;stroke-width:1.2;fill:none}
 .dash{stroke:#767676;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
 .ah{fill:#767676}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
</defs>
<rect width="1600" height="920" fill="#fff"/>
<text class="h" x="60" y="52">ONE SUBJECT, EVERY CHANNEL: CONSENT IS PER TLD, DATA MOVES IN REAL TIME</text>
<text class="g" x="60" y="76">every enterprise runs a CMP per country site, four clouds behind a JVM bus, and two audiences that need the same answer</text>
<path class="rule" d="M60,96H1540"/>
<rect class="box" x="60" y="108" width="1480" height="44"/>
<text class="k" x="76" y="128">SHARED SUBSTRATE · CLOUDFLARE</text>
<text class="c" x="300" y="128">OneTrust's CDN and geolocation, Shopify storefronts and Webflow hosting all answer through Cloudflare — cf-ray on every response.</text>
<text class="s" x="300" y="145">Each vendor owns its own zone. The brand's namespace is the one place on that shared network the brand controls, so the fix sits where the traffic already is.</text>
<g transform="translate(0,60)">

<!-- A · today -->
<rect class="band" x="40" y="112" width="740" height="672"/>
<text class="sec" x="60" y="136">A · TODAY: CONSENT LIVES IN EACH SITE'S BROWSER</text>
<rect class="box" x="60" y="152" width="216" height="96"/>
<text class="bt" x="74" y="176">uk.brand.com</text>
<text class="c" x="74" y="198">UK GDPR · PECR</text>
<text class="s" x="74" y="218">OptanonConsent cookie</text>
<text class="s" x="74" y="236">own CMP script, own domain ID</text>
<rect class="box" x="302" y="152" width="216" height="96"/>
<text class="bt" x="316" y="176">ca.brand.com</text>
<text class="c" x="316" y="198">PIPEDA · Québec Law 25</text>
<text class="s" x="316" y="218">OptanonConsent cookie</text>
<text class="s" x="316" y="236">own CMP script, own domain ID</text>
<rect class="box" x="544" y="152" width="216" height="96"/>
<text class="bt" x="558" y="176">fr.brand.com</text>
<text class="c" x="558" y="198">GDPR · CNIL guidance</text>
<text class="s" x="558" y="218">OptanonConsent cookie</text>
<text class="s" x="558" y="236">own CMP script, own domain ID</text>

<rect class="gap" x="60" y="266" width="700" height="62"/>
<text class="r" x="74" y="290">1 · Cookie scope across markets</text>
<text class="c" x="74" y="312">Scoped to .brand.com, a UK choice is replayed on fr.brand.com under the wrong rules. Per host, a withdrawal never travels.</text>
<rect class="gap" x="60" y="340" width="700" height="62"/>
<text class="r" x="74" y="364">2 · Dangling subdomain: promo.brand.com</text>
<text class="c" x="74" y="386">Any subdomain may set a .brand.com cookie, so one forgotten CNAME can forge "accept all" for every market.</text>
<rect class="gap" x="60" y="414" width="700" height="62"/>
<text class="r" x="74" y="438">3 · Plugin wildcards in the visible theme</text>
<text class="c" x="74" y="460">Domain=.brand.com · Access-Control-Allow-Origin: * · postMessage(msg, "*") · script-src * — a map anyone can read.</text>
<rect class="gap" x="60" y="488" width="700" height="62"/>
<text class="r" x="74" y="512">4 · A session ID, not a subject</text>
<text class="c" x="74" y="534">The record is keyed to a browser ID in the vendor's log. POS, app, chatbot and devices never present it.</text>

<rect class="gap" x="60" y="572" width="330" height="140"/>
<text class="r" x="74" y="596">JVM service bus, polled every 15 min</text>
<text class="c" x="74" y="620">Azure — ERP: SAP, Dynamics</text>
<text class="c" x="74" y="642">SaaS — CRM: Klaviyo, Salesforce</text>
<text class="c" x="74" y="664">AWS — EDI: X12, EDIFACT</text>
<text class="c" x="74" y="686">GCP — Merchant Center, BigQuery</text>
<path class="ln" d="M390,612H440" marker-end="url(#a)"/>
<path class="ln" d="M390,672H440" marker-end="url(#a)"/>
<rect class="box" x="440" y="572" width="320" height="64"/>
<text class="k" x="454" y="596">Google Merchant · Ads audience</text>
<text class="s" x="454" y="618">built from the last export and the last poll</text>
<rect class="box" x="440" y="648" width="320" height="64"/>
<text class="k" x="454" y="672">Shopify audience</text>
<text class="s" x="454" y="694">segments on a separate marketing-consent field</text>
<text class="c" x="60" y="742">A withdrawal on fr.brand.com reaches both audiences only after the next poll</text>
<text class="c" x="60" y="762">and the next refresh — and never reaches the till, the app or the device.</text>

<!-- B · the fix -->
<text class="sec" x="840" y="136">B · THE FIX: ONE SUBJECT, EVERY CHANNEL, SOCKETED</text>
<rect class="box" x="840" y="152" width="180" height="52"/>
<text class="k" x="852" y="173">Web · uk · ca · fr</text>
<text class="s" x="852" y="192">anonymous until signed in</text>
<rect class="box" x="840" y="214" width="180" height="52"/>
<text class="k" x="852" y="235">Mobile app</text>
<text class="s" x="852" y="254">app user JWT</text>
<rect class="box" x="840" y="276" width="180" height="52"/>
<text class="k" x="852" y="297">POS</text>
<text class="s" x="852" y="316">staff session + customer ID</text>
<rect class="box" x="840" y="338" width="180" height="52"/>
<text class="k" x="852" y="359">Chatbot · agent</text>
<text class="s" x="852" y="378">crm_jwt under a mandate</text>
<rect class="box" x="840" y="400" width="180" height="52"/>
<text class="k" x="852" y="421">IoT device</text>
<text class="s" x="852" y="440">device attestation</text>
<rect class="box" x="840" y="462" width="180" height="52"/>
<text class="k" x="852" y="483">Firmware fetch</text>
<text class="s" x="852" y="502">attestation + SBOM hash</text>
<path class="ln" d="M1020,178C1040,178 1040,290 1060,290" marker-end="url(#a)"/>
<path class="ln" d="M1020,240C1040,240 1040,300 1060,300" marker-end="url(#a)"/>
<path class="ln" d="M1020,302H1060" marker-end="url(#a)"/>
<path class="ln" d="M1020,364C1040,364 1040,312 1060,312" marker-end="url(#a)"/>
<path class="ln" d="M1020,426C1040,426 1040,324 1060,324" marker-end="url(#a)"/>
<path class="ln" d="M1020,488C1040,488 1040,336 1060,336" marker-end="url(#a)"/>

<rect class="goal" x="1060" y="196" width="230" height="226"/>
<text class="bt" x="1076" y="224">Cloudflare Worker</text>
<text class="b" x="1076" y="248">the "Buy" app</text>
<text class="c" x="1076" y="276">per-brand dispatch namespace</text>
<text class="c" x="1076" y="298">checks signature, market,</text>
<text class="c" x="1076" y="316">purpose and freshness</text>
<text class="c" x="1076" y="344">Rust in the loop:</text>
<text class="c" x="1076" y="362">market and purpose are types</text>
<text class="k" x="1076" y="396">fail closed</text>

<rect class="box" x="1330" y="152" width="210" height="128"/>
<text class="bt" x="1344" y="176">Xano</text>
<text class="b" x="1344" y="198">system of record</text>
<text class="c" x="1344" y="222">posture per subject, per market</text>
<text class="c" x="1344" y="242">every choice: source, time</text>
<text class="c" x="1344" y="262">append-only ledger</text>
<path class="ln" d="M1290,230H1330" marker-end="url(#a)"/>
<rect class="proj" x="1330" y="306" width="210" height="96"/>
<text class="bt" x="1344" y="330">KV namespace</text>
<text class="c" x="1344" y="352">consent:{market}:{subject}</text>
<text class="s" x="1344" y="372">projection read on every request</text>
<text class="s" x="1344" y="390">carries the ledger version</text>
<path class="dash" d="M1435,280V306" marker-end="url(#a)"/>
<path class="ln" d="M1330,354H1290" marker-end="url(#a)"/>

<path class="ln" d="M1175,422V450" marker-end="url(#a)"/>
<path class="sock" d="M1050,456H1540"/>
<text class="sec" x="1210" y="446">EVENT SOCKET · MARKET ∧ PURPOSE ∧ FRESH</text>
<path class="ln" d="M1116,456V496" marker-end="url(#a)"/>
<path class="ln" d="M1238,456V496" marker-end="url(#a)"/>
<path class="ln" d="M1360,456V496" marker-end="url(#a)"/>
<path class="ln" d="M1482,456V496" marker-end="url(#a)"/>
<rect class="box" x="1060" y="496" width="112" height="62"/>
<text class="k" x="1070" y="518">Azure</text>
<text class="s" x="1070" y="536">Service Bus</text>
<text class="s" x="1070" y="550">ERP</text>
<rect class="box" x="1182" y="496" width="112" height="62"/>
<text class="k" x="1192" y="518">CRM SaaS</text>
<text class="s" x="1192" y="536">Klaviyo</text>
<text class="s" x="1192" y="550">Salesforce</text>
<rect class="box" x="1304" y="496" width="112" height="62"/>
<text class="k" x="1314" y="518">AWS</text>
<text class="s" x="1314" y="536">EventBridge</text>
<text class="s" x="1314" y="550">EDI</text>
<rect class="box" x="1426" y="496" width="114" height="62"/>
<text class="k" x="1436" y="518">GCP</text>
<text class="s" x="1436" y="536">Pub/Sub · Merchant</text>
<text class="s" x="1436" y="550">BigQuery</text>

<path class="ln" d="M1483,558V588" marker-end="url(#a)"/>
<rect class="box" x="1304" y="588" width="236" height="62"/>
<text class="k" x="1318" y="610">Rust writer · gRPC (tonic)</text>
<text class="s" x="1318" y="628">BigQuery Storage Write API</text>
<text class="s" x="1318" y="642">Merchant API · posture on every row</text>

<path class="ln" d="M1050,456V712H1060" marker-end="url(#a)"/>
<path class="ln" d="M1422,650V680" marker-end="url(#a)"/>
<rect class="goal" x="1060" y="680" width="230" height="64"/>
<text class="k" x="1074" y="704">Shopify audience · socketed</text>
<text class="s" x="1074" y="724">segments + marketing consent</text>
<rect class="goal" x="1304" y="680" width="236" height="64"/>
<text class="k" x="1318" y="704">Google Merchant · Ads · socketed</text>
<text class="s" x="1318" y="724">same posture version as Shopify</text>

<rect class="box" x="840" y="540" width="190" height="204"/>
<text class="k" x="852" y="562">Seconds, not polls</text>
<text class="s" x="852" y="586">a withdrawal writes Xano,</text>
<text class="s" x="852" y="602">the KV projection and the</text>
<text class="s" x="852" y="618">socket in one request</text>
<text class="s" x="852" y="642">a fr choice can never feed</text>
<text class="s" x="852" y="658">a uk audience: it is a type</text>
<text class="s" x="852" y="682">no ESB between clouds;</text>
<text class="s" x="852" y="698">each keeps its own bus</text>
<text class="s" x="852" y="722">no wildcards in the theme</text>

<path class="rule" d="M60,800H1540"/>
<text class="s" x="60" y="824">Heavy box = the gate or a socketed audience. Red dashed = a gap. Grey dashed = a projection, not truth.</text>
<text class="s" x="60" y="842">Country sites are shown as subdomains. With brand.co.uk, brand.ca and brand.fr no cookie can be shared at all, which makes the subject record the only bridge.</text>
</g>
</svg>
