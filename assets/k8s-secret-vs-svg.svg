<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 960" role="img" aria-labelledby="t d">
<title id="t">Kubernetes Secret vs SVG bundle: base64 is a wrapper, not a lock</title>
<desc id="d">Two flows side by side. A Kubernetes Secret: YAML with a base64 password is stored in etcd as base64 unless encryption at rest is on, read through the API server where RBAC decides who may get or list it, and mounted into a pod as a decoded file; committing the YAML to Git keeps the base64 in history forever. An SVG bundle: an SVG embeds patient metadata and a base64 nested SVG that carries an onload handler; the browser decodes it, draws it as a picture through img with no script, or runs the outer file's script on your origin when inlined; anyone with the file decodes every embedded byte. A table compares format, encoding, who decodes, access control, encryption at rest, execution and scanning. Three cards give the shared lesson: decode before you scan, keep secrets out of both, and only Kubernetes has a lock you can turn on.</desc>
<defs><style>
 .h{font:700 20px Helvetica,Arial,sans-serif;fill:#000}
 .sec{font:700 10px Helvetica,Arial,sans-serif;fill:#767676;letter-spacing:.2em}
 .bt{font:700 13px Helvetica,Arial,sans-serif;fill:#000}
 .lt{font:700 15px Helvetica,Arial,sans-serif;fill:#000}
 .b{font:11px Helvetica,Arial,sans-serif;fill:#000}
 .g{font:11px Helvetica,Arial,sans-serif;fill:#767676}
 .s{font:10px Helvetica,Arial,sans-serif;fill:#767676}
 .lab{font:700 9px Helvetica,Arial,sans-serif;fill:#767676;letter-spacing:.1em}
 .c{font:11px 'Courier New',Courier,monospace;fill:#000}
 .cg{font:11px 'Courier New',Courier,monospace;fill:#767676}
 .n{font:700 10px Helvetica,Arial,sans-serif;fill:#c8102e;text-anchor:middle}
 .box{fill:#fff;stroke:#000;stroke-width:1.5}
 .gap{fill:#fff;stroke:#c8102e;stroke-width:1.6;stroke-dasharray:5 4}
 .rule{stroke:#000;stroke-width:.8;fill:none}
 .ln{stroke:#767676;stroke-width:1.2;fill:none}
 .ah{fill:#767676}
</style></defs>
<rect width="1600" height="960" fill="#fff"/>
<text class="h" x="60" y="52">KUBERNETES SECRET vs SVG BUNDLE — BASE64 IS A WRAPPER, NOT A LOCK</text>
<text class="g" x="60" y="76">both carry encoded bytes inside a text format; only one of them can be locked</text>
<text class="s" x="1540" y="76" text-anchor="end">Red dashed = a gap. Numbers match the security gaps article.</text>
<path class="rule" d="M60,96H1540"/>
<text class="sec" x="60" y="124">SAME WRAPPER, TWO PATHS</text>
<text class="lt" x="60" y="154">Kubernetes Secret: configuration the cluster decodes</text>
<rect class="box" x="60" y="168" width="340" height="160"/>
<text class="c" x="74" y="194" xml:space="preserve">apiVersion: v1</text>
<text class="c" x="74" y="212" xml:space="preserve">kind: Secret</text>
<text class="c" x="74" y="230" xml:space="preserve">metadata:</text>
<text class="c" x="74" y="248" xml:space="preserve">  name: db</text>
<text class="c" x="74" y="266" xml:space="preserve">data:</text>
<text class="c" x="74" y="284" xml:space="preserve">  password: c3VwZXItc2VjcmV0</text>
<text class="cg" x="74" y="302" xml:space="preserve">  # base64 of &quot;super-secret&quot;</text>
<rect class="gap" x="450" y="168" width="340" height="50"/>
<text class="bt" x="464" y="190">etcd</text>
<text class="b" x="464" y="208">stored as base64, unless encryption at rest is on</text>
<rect x="750.0" y="175" width="28" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="n" x="764.0" y="187.5">24</text>
<rect class="box" x="450" y="236" width="340" height="50"/>
<text class="bt" x="464" y="258">API server · RBAC</text>
<text class="b" x="464" y="276">decides who may get or list the Secret</text>
<rect class="box" x="450" y="304" width="340" height="50"/>
<text class="bt" x="464" y="326">Pod</text>
<text class="b" x="464" y="344">mounted as a file, decoded: super-secret</text>
<path class="ln" d="M402,193L441.0,193.0"/>
<path class="ah" d="M448,193L439.0,188.5L439.0,197.5z"/>
<path class="ln" d="M620,220L620.0,227.0"/>
<path class="ah" d="M620,234L624.5,225.0L615.5,225.0z"/>
<path class="ln" d="M620,288L620.0,295.0"/>
<path class="ah" d="M620,302L624.5,293.0L615.5,293.0z"/>
<rect class="gap" x="60" y="350" width="340" height="50"/>
<text class="bt" x="74" y="372">Committed to Git</text>
<text class="b" x="74" y="390">base64 in history forever: anyone with the repo</text>
<rect x="367.0" y="357" width="21" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="n" x="377.5" y="369.5">1</text>
<path class="ln" d="M230,330L230.0,341.0"/>
<path class="ah" d="M230,348L234.5,339.0L225.5,339.0z"/>
<text class="lt" x="810" y="154">SVG bundle: content the browser decodes</text>
<rect class="box" x="810" y="168" width="340" height="160"/>
<text class="c" x="824" y="194" xml:space="preserve">&lt;svg xmlns=&quot;…&quot;&gt;</text>
<text class="c" x="824" y="212" xml:space="preserve">  &lt;metadata&gt;MRN 0042&lt;/metadata&gt;</text>
<text class="c" x="824" y="230" xml:space="preserve">  &lt;image href=&quot;data:image/svg+xml;</text>
<text class="c" x="824" y="248" xml:space="preserve">    base64,PHN2ZyBvbmxvYWQ9ImZldGNoKA==…&quot;/&gt;</text>
<text class="c" x="824" y="266" xml:space="preserve">&lt;/svg&gt;</text>
<text class="cg" x="824" y="284" xml:space="preserve"></text>
<text class="cg" x="824" y="302" xml:space="preserve">  # the nested SVG carries onload=…</text>
<rect class="box" x="1200" y="168" width="340" height="50"/>
<text class="bt" x="1214" y="190">Browser</text>
<text class="b" x="1214" y="208">decodes every data URI it meets</text>
<rect class="box" x="1200" y="236" width="340" height="50"/>
<text class="bt" x="1214" y="258">&lt;img&gt; or &lt;image&gt;</text>
<text class="b" x="1214" y="276">drawn as a picture: no script runs</text>
<rect class="gap" x="1200" y="304" width="340" height="50"/>
<text class="bt" x="1214" y="326">Inline &lt;svg&gt;</text>
<text class="b" x="1214" y="344">the outer file&#x27;s script runs on your origin</text>
<rect x="1507.0" y="311" width="21" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="n" x="1517.5" y="323.5">3</text>
<path class="ln" d="M1152,193L1191.0,193.0"/>
<path class="ah" d="M1198,193L1189.0,188.5L1189.0,197.5z"/>
<path class="ln" d="M1370,220L1370.0,227.0"/>
<path class="ah" d="M1370,234L1374.5,225.0L1365.5,225.0z"/>
<path class="ln" d="M1260,218V226H1184V329H1192"/>
<path class="ln" d="M1191,329L1191.0,329.0"/>
<path class="ah" d="M1198,329L1189.0,324.5L1189.0,333.5z"/>
<text class="s" x="1170" y="282" text-anchor="middle">or</text>
<rect class="gap" x="810" y="350" width="340" height="50"/>
<text class="bt" x="824" y="372">Anyone with the file</text>
<text class="b" x="824" y="390">decodes every embedded byte, metadata included</text>
<rect x="1117.0" y="357" width="21" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="n" x="1127.5" y="369.5">7</text>
<rect x="1090.0" y="357" width="21" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="n" x="1100.5" y="369.5">1</text>
<path class="ln" d="M980,330L980.0,341.0"/>
<path class="ah" d="M980,348L984.5,339.0L975.5,339.0z"/>
<path class="rule" d="M790,140V404" style="stroke:#ddd"/>
<path class="rule" d="M60,440H1540"/>
<text class="sec" x="60" y="468">WHERE THEY ARE ALIKE, AND WHERE THEY DIFFER</text>
<text class="lab" x="60" y="496">CONCERN</text>
<text class="lab" x="300" y="496">KUBERNETES SECRET</text>
<text class="lab" x="920" y="496">SVG BUNDLE</text>
<path class="rule" d="M60,506H1540"/>
<text class="bt" x="60" y="528">Text format</text>
<text class="b" x="300" y="528">YAML or JSON</text>
<text class="b" x="920" y="528">XML</text>
<path class="rule" d="M60,539H1540" style="stroke:#ddd"/>
<text class="bt" x="60" y="558">What&#x27;s encoded</text>
<text class="b" x="300" y="558">Passwords, keys, certificates under data:</text>
<text class="b" x="920" y="558">Images, fonts or other SVGs in data: URIs</text>
<path class="rule" d="M60,569H1540" style="stroke:#ddd"/>
<text class="bt" x="60" y="588">Who decodes it</text>
<text class="b" x="300" y="588">The cluster, into a pod&#x27;s files or environment</text>
<text class="b" x="920" y="588">The browser, as it draws</text>
<path class="rule" d="M60,599H1540" style="stroke:#ddd"/>
<text class="bt" x="60" y="618">Access control</text>
<text class="b" x="300" y="618">RBAC on get, list and watch</text>
<text class="b" x="920" y="618">None once shipped: the file is the content</text>
<path class="rule" d="M60,629H1540" style="stroke:#ddd"/>
<text class="bt" x="60" y="648">Encryption at rest</text>
<text class="b" x="300" y="648">Possible: etcd encryption with a KMS provider</text>
<text class="b" x="920" y="648">Not possible: the bytes are the content</text>
<path class="rule" d="M60,659H1540" style="stroke:#ddd"/>
<text class="bt" x="60" y="678">Can it execute</text>
<text class="b" x="300" y="678">No: it is configuration</text>
<text class="b" x="920" y="678">Yes, when the outer SVG is inlined (gap 3)</text>
<path class="rule" d="M60,689H1540" style="stroke:#ddd"/>
<text class="bt" x="60" y="708">A text scanner sees</text>
<text class="b" x="300" y="708">Only the encoded value (gap 2)</text>
<text class="b" x="920" y="708">Only the encoded payload (gap 2)</text>
<path class="rule" d="M60,719H1540" style="stroke:#ddd"/>
<path class="rule" d="M60,770H1540"/>
<text class="sec" x="60" y="798">THE SHARED LESSON</text>
<rect class="box" x="60" y="814" width="480" height="90"/>
<text class="bt" x="74" y="836">Decode before you scan</text>
<rect x="507.0" y="821" width="21" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="n" x="517.5" y="833.5">2</text>
<text class="b" x="74" y="862">Secret scanners must decode data: values;</text>
<text class="b" x="74" y="880">SVG sanitizers must open nested data URIs.</text>
<rect class="box" x="560" y="814" width="480" height="90"/>
<text class="bt" x="574" y="836">Keep secrets out of both</text>
<rect x="1007.0" y="821" width="21" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="n" x="1017.5" y="833.5">1</text>
<text class="b" x="574" y="862">A Secret YAML in Git and an SVG with an</text>
<text class="b" x="574" y="880">embedded payload leak the same way.</text>
<rect class="box" x="1060" y="814" width="480" height="90"/>
<text class="bt" x="1074" y="836">Only one has a lock</text>
<rect x="1507.0" y="821" width="21" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="n" x="1517.5" y="833.5">7</text>
<rect x="1473.0" y="821" width="28" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="n" x="1487.0" y="833.5">24</text>
<text class="b" x="1074" y="862">Kubernetes: RBAC plus etcd encryption.</text>
<text class="b" x="1074" y="880">An SVG: carry nothing private at all.</text>
<text class="bt" x="60" y="938">Base64 changes how bytes are written, not who can read them.</text>
</svg>