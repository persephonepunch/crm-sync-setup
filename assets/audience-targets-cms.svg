<path class="rule" d="M60,1170H1540"/>
<text class="secr" x="60" y="1198">EIGHT GAPS — AND THE FIX FOR EACH</text>
<rect x="62.0" y="1215" width="28" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="nr" x="76" y="1227.5">T1</text>
<text class="btr" x="100" y="1228">Members stored in the CMS</text>
<text class="b" x="100" y="1244">Fix: Definitions only; Contains personal data must be off, or the sync refuses the item</text>
<rect x="62.0" y="1255" width="28" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="nr" x="76" y="1267.5">T2</text>
<text class="btr" x="100" y="1268">A template page publishes the collection</text>
<text class="b" x="100" y="1284">Fix: Don&#x27;t bind it to a Collection template page; every field on one is public</text>
<rect x="62.0" y="1295" width="28" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="nr" x="76" y="1307.5">T3</text>
<text class="btr" x="100" y="1308">The agent publishes its own audience</text>
<text class="b" x="100" y="1324">Fix: Agents create drafts only; a person reviews and publishes</text>
<rect x="62.0" y="1335" width="28" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="nr" x="76" y="1347.5">T4</text>
<text class="btr" x="100" y="1348">Definition changed after approval</text>
<text class="b" x="100" y="1364">Fix: A definition hash recorded at approval; a mismatch blocks the sync</text>
<rect x="812.0" y="1215" width="28" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="nr" x="826" y="1227.5">T5</text>
<text class="btr" x="850" y="1228">Small slices identify people</text>
<text class="b" x="850" y="1244">Fix: Counts below Min cohort left empty in every snapshot</text>
<rect x="812.0" y="1255" width="28" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="nr" x="826" y="1267.5">T6</text>
<text class="btr" x="850" y="1268">Open DSR still targeted</text>
<text class="b" x="850" y="1284">Fix: DSR checked first, before consent, on every sync</text>
<rect x="812.0" y="1295" width="28" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="nr" x="826" y="1307.5">T7</text>
<text class="btr" x="850" y="1308">Precise location or device IDs</text>
<text class="b" x="850" y="1324">Fix: Country or region and a device class only</text>
<rect x="812.0" y="1335" width="28" height="18" rx="9" fill="#fff" stroke="#c8102e" stroke-width="1.3" stroke-dasharray="3 2"/><text class="nr" x="826" y="1347.5">T8</text>
