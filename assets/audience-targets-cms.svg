<text class="c" x="1074" y="418" xml:space="preserve">  &quot;consent&quot;: { &quot;ad_user_data&quot;: true,</text>
<text class="c" x="1074" y="436" xml:space="preserve">               &quot;ad_personalization&quot;: true,</text>
<text class="c" x="1074" y="454" xml:space="preserve">               &quot;marketing&quot;: true, &quot;training&quot;: false },</text>
<text class="c" x="1074" y="472" xml:space="preserve">  &quot;dsr&quot;: { &quot;open&quot;: null },</text>
<text class="c" x="1074" y="490" xml:space="preserve">  &quot;device_class&quot;: &quot;mobile_web&quot;,</text>
