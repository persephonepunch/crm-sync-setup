<title id="t">Audience targets in a CMS: definitions, not members</title>
<desc id="d">An AI-enabled audience collection in Webflow stores definitions, never members. Lifecycle: an agent proposes an audience as a draft with its rationale and eval result, a person reviews it and records the definition hash, the published item goes Live, the sync reads only Live items whose hash matches, and destinations receive members with consent fields attached. Where each piece lives: the Webflow collection holds the definition, the targeting state (consent state, DSR rule, devices, location and campaigns), the AI fields and the approval; Xano and the ledger hold each person's consent, DSR, device class, coarse location and campaigns; the sync joins them and writes only totals back to Webflow as Audience States. The sync checks in order and stops at the first failure: DSR, consent, location, device, campaign, then cohort size. An example Audience States table shows counts, with every count below the minimum cohort left empty. Eight red gaps have fixes.</desc>
