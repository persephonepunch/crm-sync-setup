<text class="sec" x="60" y="328">WHERE EACH PIECE LIVES</text>
<rect class="box" x="60" y="344" width="640" height="300"/>
<text class="bt" x="74" y="368">Webflow CMS · Audience Targets (definitions)</text>
<rect x="74" y="382" width="296" height="100" fill="#fff" stroke="#000" stroke-width="1"/>
<text class="lab" x="86" y="402">DEFINITION</text>
<text class="b" x="86" y="424">format: Shopify segment query</text>
<text class="b" x="86" y="442">definition: the query, not members</text>
<text class="b" x="86" y="460">definition hash · source system</text>
<rect x="384" y="382" width="296" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/>
<text class="lab" x="396" y="402">TARGETING STATE</text>
<text class="b" x="396" y="424">consent state · DSR rule</text>
<text class="b" x="396" y="442">devices · device signal</text>
<text class="b" x="396" y="460">location granularity and source · campaigns</text>
<rect x="74" y="494" width="296" height="100" fill="#fff" stroke="#000" stroke-width="1"/>
<text class="lab" x="86" y="514">AI</text>
<text class="b" x="86" y="536">proposed by · rationale</text>
<text class="b" x="86" y="554">eval result: PASS, FAIL, REVIEW</text>
<text class="b" x="86" y="572">assistant summary · embedding text</text>
<rect x="384" y="494" width="296" height="100" fill="#fff" stroke="#000" stroke-width="1"/>
<text class="lab" x="396" y="514">APPROVAL AND LIMITS</text>
<text class="b" x="396" y="536">approved by · approved at · ledger</text>
<text class="b" x="396" y="554">min cohort · retire by</text>
<text class="b" x="396" y="572">contains personal data: off</text>
<text class="s" x="74" y="622">Also: Markets · Consent Purposes · Destinations · Adapters · DSR Types · Device Classes · Campaigns · Audience States</text>
<rect class="box" x="760" y="404" width="240" height="180" style="stroke-width:3"/>
<text class="bt" x="774" y="428">Sync (Worker)</text>
<text class="b" x="774" y="448">reads Live items only</text>
<text class="b" x="774" y="465">loads each matched person&#x27;s</text>
<text class="b" x="774" y="482">state from Xano</text>
<text class="b" x="774" y="499">checks DSR, consent, location,</text>
<text class="b" x="774" y="516">device, campaign, cohort</text>
<text class="b" x="774" y="533">sends with consent fields</text>
