<text x="60" y="358" style="font:400 15px Helvetica,Arial,sans-serif;fill:#767676">after the gate</text>
<rect x="210" y="342" width="264.6" height="22" fill="#d9d9d9"/>
<text x="484.6" y="359" style="font:400 15px Helvetica,Arial,sans-serif;fill:#000">630,000</text>
<text x="60" y="392" style="font:400 15px Helvetica,Arial,sans-serif;fill:#767676">after the cache</text>
