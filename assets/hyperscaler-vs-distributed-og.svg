<path class="rule" d="M60,212H1140"/>
<text class="sec" x="60" y="252">BIND BEFORE YOU ALLOCATE · ILLUSTRATIVE FUNNEL</text>
<text x="60" y="290" style="font:400 15px Helvetica,Arial,sans-serif;fill:#767676">requests</text>
