<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d">
<title id="t">Four runtimes, four resolution planes, one join</title>
<desc id="d">Salesforce, Adobe, Shopify and Google Merchant and Ads each run on their own runtime and resolve customers, products and consent on their own terms: Salesforce on Java with Data Cloud identity resolution and its consent objects; Adobe on Java for AEM and PHP for Adobe Commerce, with the Experience Platform identity graph and governance labels; Shopify on Ruby on Rails with Wasm Functions written in Rust or compiled with Javy, global IDs and the Customer Privacy API; Google Merchant and Ads behind an API with BigQuery exports, offerId and GTIN keys, hashed user data and Consent Mode v2. Only JSON over HTTPS crosses between them. Every arrow meets at one join, your middleware, iPaaS or agent, which maps IDs, carries consent, propagates deletion and records each mapping. Security gaps at the join are marked in red: consent drops, IDs resolve differently, deletion and opt-out don't propagate, the join keeps copies, payloads aren't validated against the contract, and data moves across regions. A table states what crosses the boundary, and six red gaps have fixes.</desc>
<defs><style>
