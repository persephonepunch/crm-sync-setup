<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 750" role="img" aria-labelledby="t d">
<title id="t">Hyperscaler vs distributed: the thread, and where each answer lands</title>
<desc id="d">A spectrum from centralized to distributed: hyperscalers (AWS, Azure, Google Cloud), neoclouds (CoreWeave), edge networks (Cloudflare, Fastly, Akamai), and the person&#x27;s own device. Four questions along it: CoreWeave or Cloudflare (different layers, use both); hyperscaler or distributed (core central, edge in front); where AEM Edge Functions run (on Fastly Compute behind Adobe&#x27;s managed CDN, in beta); can Xano distribute Kubernetes (no, one instance per jurisdiction with an edge router and gate). The answers feed an orchestration ladder and an AI binding ladder, which lead to the enterprise impact.</desc>
<defs><style>
 .h{font:700 20px Helvetica,Arial,sans-serif;fill:#000}
 .sec{font:700 10px Helvetica,Arial,sans-serif;fill:#767676;letter-spacing:.2em}
 .bt{font:700 15px Helvetica,Arial,sans-serif;fill:#000}
 .lt{font:700 14px Helvetica,Arial,sans-serif;fill:#000}
 .b{font:13px Helvetica,Arial,sans-serif;fill:#000}
 .g{font:12px Helvetica,Arial,sans-serif;fill:#767676}
 .s{font:11px Helvetica,Arial,sans-serif;fill:#767676}
 .box{fill:#fff;stroke:#000;stroke-width:1.5}
 .goal{fill:#fff;stroke:#000;stroke-width:3}
 .gap{fill:#fff;stroke:#c8102e;stroke-width:1.6;stroke-dasharray:5 4}
 .band{fill:#f4f4f4;stroke:none}
 .rule{stroke:#000;stroke-width:.8;fill:none}
 .ln{stroke:#767676;stroke-width:1.2;fill:none}
 .dash{stroke:#767676;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
 .ah{fill:#767676}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
</defs>
<rect width="1600" height="750" fill="#fff"/>
<text class="h" x="60" y="52">HYPERSCALER VS DISTRIBUTED — THE THREAD, AND WHERE EACH ANSWER LANDS</text>
<text class="g" x="60" y="76">a spectrum of where compute lives, four questions asked along it, and the two ladders this article builds from the answers</text>
<text class="s" x="1540" y="76" text-anchor="end">Heavy box = the outcome.</text>
<path class="rule" d="M60,96H1540"/>
<text class="sec" x="60" y="130">THE SPECTRUM</text>
<text class="g" x="60" y="162">CENTRALIZED</text>
<text class="g" x="1540" y="162" text-anchor="end">DISTRIBUTED</text>
<path class="ln" d="M160,158H1430" marker-end="url(#a)"/>
<rect class="box" x="60" y="180" width="355" height="100"/>
<text class="bt" x="76" y="208">Hyperscaler</text>
<text class="b" x="76" y="232">AWS, Azure, Google Cloud</text>
<text class="b" x="76" y="252">few huge regions; heavy, stateful work</text>
<rect class="box" x="435" y="180" width="355" height="100"/>
<text class="bt" x="451" y="208">Neocloud (GPU cloud)</text>
<text class="b" x="451" y="232">CoreWeave</text>
<text class="b" x="451" y="252">dense GPU clusters; training, large models</text>
<rect class="box" x="810" y="180" width="355" height="100"/>
<text class="bt" x="826" y="208">Edge network</text>
<text class="b" x="826" y="232">Cloudflare, Fastly, Akamai</text>
<text class="b" x="826" y="252">hundreds of cities; light request logic</text>
<rect class="box" x="1185" y="180" width="355" height="100"/>
<text class="bt" x="1201" y="208">Device</text>
<text class="b" x="1201" y="232">phones, laptops, consoles</text>
<text class="b" x="1201" y="252">the person&#x27;s own GPU; data stays put</text>
<text class="sec" x="60" y="330">THE THREAD · FOUR QUESTIONS</text>
<rect class="box" x="60" y="350" width="345" height="150"/>
<text class="bt" x="76" y="378">1 · CoreWeave or Cloudflare?</text>
<text class="b" x="76" y="402">Different layers: GPU compute vs</text>
<text class="b" x="76" y="422">the network in front of users.</text>
<text class="b" x="76" y="442">Production systems use both.</text>
<text class="g" x="76" y="486">lands on: neocloud + edge</text>
<path class="ln" d="M232.5,500V540"/>
<rect class="box" x="438" y="350" width="345" height="150"/>
<text class="bt" x="454" y="378">2 · Hyperscaler or distributed?</text>
<text class="b" x="454" y="402">Throughput and state vs latency</text>
<text class="b" x="454" y="422">and reach. Keep the core central</text>
<text class="b" x="454" y="442">and put the edge in front.</text>
<text class="g" x="454" y="486">lands on: the whole spectrum</text>
<path class="ln" d="M610.5,500V540"/>
<rect class="box" x="816" y="350" width="345" height="150"/>
<text class="bt" x="832" y="378">3 · Where do AEM Edge Functions run?</text>
<text class="b" x="832" y="402">Adobe rents the edge: functions</text>
<text class="b" x="832" y="422">run on Fastly Compute behind</text>
<text class="b" x="832" y="442">Adobe&#x27;s managed CDN (beta).</text>
<text class="g" x="832" y="486">lands on: edge, rented</text>
<path class="ln" d="M988.5,500V540"/>
<rect class="box" x="1194" y="350" width="345" height="150"/>
<text class="bt" x="1210" y="378">4 · Can Xano distribute Kubernetes?</text>
<text class="b" x="1210" y="402">No. One Xano instance per</text>
<text class="b" x="1210" y="422">jurisdiction; an edge router</text>
<text class="b" x="1210" y="442">and gate do the distributing.</text>
<text class="g" x="1210" y="486">lands on: hyperscaler + edge</text>
<path class="ln" d="M1366.5,500V540"/>
<path class="ln" d="M232.5,540H1366.5"/>
<text class="sec" x="60" y="580">THIS ARTICLE</text>
<rect class="box" x="60" y="600" width="460" height="100"/>
<text class="bt" x="76" y="628">Orchestration ladder</text>
<text class="b" x="76" y="652">where logic runs: Webflow, Worker,</text>
<text class="b" x="76" y="672">Durable Object, Xano, your own cloud</text>
<rect class="box" x="570" y="600" width="460" height="100"/>
<text class="bt" x="586" y="628">AI binding ladder</text>
<text class="b" x="586" y="652">where the model runs and what it may</text>
<text class="b" x="586" y="672">touch: rules up to dedicated GPUs</text>
<rect class="goal" x="1080" y="600" width="460" height="100"/>
<text class="bt" x="1096" y="628">Enterprise impact</text>
<text class="b" x="1096" y="652">residency, latency, egress cost,</text>
<text class="b" x="1096" y="672">audit scope, failure mode, skills</text>
<path class="ln" d="M290.0,540L290.0,598" marker-end="url(#a)"/>
<path class="ln" d="M800.0,540L800.0,598" marker-end="url(#a)"/>
<path class="ln" d="M520,650L568,650" marker-end="url(#a)"/>
<path class="ln" d="M1030,650L1078,650" marker-end="url(#a)"/>
</svg>
