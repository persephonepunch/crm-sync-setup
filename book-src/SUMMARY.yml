# The CRM Sync book: what is in it, and in what order. mdBook's SUMMARY.md, as YAML.
#
# A file listed here appears in the book. Its CHAPTER is its own front-matter `category`;
# the chapter heading here must match it, or the build stops and says which file disagrees.
# So a doc moves chapter by editing its category (one writer), and this file only orders.
# Reorder chapters or docs freely. Seeded 2026-10-04 from the knowledge-base list,
# docs ordered oldest first within each chapter.

